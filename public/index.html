<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShineEye</title>
<body>
<h1>ShineEye</h1>
<textarea id="text" rows="10" cols="50"></textarea><br><button id="go">Check</button>
<pre id="out"></pre>
<script>
document.getElementById('go').onclick = async () => {
  const r = await fetch('/api/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: document.getElementById('text').value }) });
  document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
</body></html>
